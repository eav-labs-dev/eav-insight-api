services:
  - type: web
    name: eav-insight-api
    runtime: docker
    plan: free
    branch: dev
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    dockerCommand: bash -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --proxy-headers'
    envVars:
      - key: APP_NAME
        value: EAV Insight API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: eav-insight-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: PASSWORD_HASH_ITERATIONS
        value: "600000"

databases:
  - name: eav-insight-db
    databaseName: eav_insight
    user: eav_insight
    plan: free
